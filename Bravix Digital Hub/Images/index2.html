<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Listing Web Page</title>
    <style>
        body{
            background-color: rgb(246, 246, 249);
            font-family: Arial, sans-serif;
            background-color: #eef5ff;
        }
     .header{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding:15px 20px;
        border-radius: 10px;
     }
     logo{
        text-align: right;
        border:none;
    
        padding: 8px 18px;
        box-shadow: 0px 6px 5px rgb(108, 18, 198);
        color: white;
        background-color: rgb(108, 18, 198);
        text-align: center;
        width: 170px;
       
    
     }
     .wee
     {
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
        gap:20px;
    
     }
     img{
        width:100%;
        height:170px;                                                                               
        object-fit: contain;
              
     }
     .card{
    
        box-shadow: 0px 4px 10px rgba(0,0,0,.2);
        margin: 10px;
        width:250px;
        text-align: center;
        background-color: #fff;
        border-radius: 10px;
        overflow: hidden;
    
     }
     footer{
        background-color: rgb(18, 17, 17);
        text-align: center;
        color:white;
        padding:15px;
        margin-top:30px;

     }
     button{
        background-color: rgb(18, 43, 7);
        border-radius: 5px;
        padding: 10px;
        color: white;
        width:90%;
        cursor: pointer;
        font-size: 16px;
        margin:10px auto;
        display: block;

        border: none;
     }
     .rupe{
        color: rgb(55, 162, 55);
       font-weight: bold;
       margin: 10px;
       height:20px ;
       text-align: center;
     }

     section{
        text-align: center;
         color: gray;
        margin-bottom: 30px;
        
     }
     h1{
        text-align: center;
        color: rgb(24, 64, 209);
        font-size: 42px;
     }
     span{
      display:block;
      background-color: red;

     }

    </style>
</head>
<body>
    <header>
