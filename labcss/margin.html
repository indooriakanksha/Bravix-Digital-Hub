<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0px;
            margin: 0px;
        }
        .container{
            gap:100px;
            margin-top: 30px;
        }
        .mar1{
            border: 2px solid black;
            border-radius: 10px;
            width:200px;
            background-color: rgb(206, 245, 232);
            margin: auto;
            padding: 10px;
            text-align: center;
          box-shadow: 3px 5px 8px rgb(206, 245, 232);
        }
        .mar2{
            border: 2px solid black;
            border-radius: 10px;
            width:200px;
            background-color: rgb(115, 202, 173);
            margin-left: 50px;
            padding: 10px;
            text-align: center;
             margin-top: 30px;
             box-shadow: 3px 5px 8px rgb(115, 202, 173);
            
        }
        .mar3{
            border: 2px solid black;
            border-radius: 10px;
            width:200px;
            background-color: rgb(239, 245, 240);
            margin-right: 80px;
            padding: 10px;
            text-align: center;
             margin-top: 30px;
             box-shadow: 3px 5px 8px rgb(239, 245, 240);
        }
        .mar4{
            border: 2px solid black;
            border-radius: 10px;
            width:200px;
            background-color: rgb(242, 226, 164);
            margin-top: 60px;
            padding: 10px;
            text-align: center;
             margin-bottom: 30px;
             margin-left: 700px;
              box-shadow: 3px 5px 10px rgb(242, 226, 164);
        }
        .mar5{
            border: 2px solid black;
            border-radius: 10px;
            width:200px;
            background-color: rgb(162, 173, 169);
            margin-bottom: 70px;
            padding: 10px;
            text-align: center;
             margin-left: 700px;
             box-shadow: 3px 10px 10px rgb(162, 173, 169) ;

        }
    </style>
</head>
<body>
    <div class="container">
   <div class="mar1">
     <p><b>Margin:Auto(centered)</b></p>
    </div>
    <div class="mar2">
   <p><b>Margin Left:50px</b></p>
    </div>
    <div class="mar3">
    <p><b>Margin Right:80px</b></p>
    </div>
    <div class="mar4">
   <p><b>Margin Top:60px</b></p>
    </div>
    <div class="mar5">
  <p><b>Margin Bottom:70px</b></p>
    </div>
    </div>
</body>
</html>
