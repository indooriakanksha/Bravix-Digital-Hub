<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            display: block;
            justify-content:center;
            gap: 100px;
            margin:auto;
            text-align: center;
            margin:100px;

        }
        .pad1{
            border: 3px solid blue;
            padding: 10px;
            background-color: rgb(191, 238, 238);
            width:200px;
            text-align: center;
            margin-top: 100px;
            margin:auto;
            margin-bottom: 20px;

        }
        .pad2{
            border: 3px solid blue;
            padding: 20px;
            background-color: rgb(191, 238, 238);
            width:300px;
            text-align: center;
            margin-top: 50px;
             margin:auto;
             margin-bottom: 20px;
        }
        .pad3{
            border: 3px solid blue;
            padding: 40px;
            background-color: rgb(191, 238, 238);
            width:350px;
            text-align: center;
            margin-top: 50px;
             margin:auto;
             margin-bottom: 20px;
        }
        .pad4{
            border: 3px solid blue;
            padding: 60px;
            background-color: rgb(191, 238, 238);
            width:400px;
            text-align: center;
            margin-top: 50px;
             margin:auto;
             margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="pad1">
       <p><b>padding:10px</b></p>
    </div>
    <div class="pad2">
      <p><b>padding:20px</b></p>
    </div>
    <div class="pad3">
     <p><b>padding:40px</b></p>
    </div>
    <div class="pad4">
  <p><b>padding:60px</b></p>
    </div>
    </div>
</body>
</html>
