<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
        }
        nav{
            background-color:black;
            display:flex;
            padding:10px;
            color: white;
        }
        .logo{
            margin-right: 75%;
        }
        span{
            margin-left: 40px;
        }
        .blue{
            background-color: blue;
            color:white;
            text-align: center;
            padding:50px;
        }
        button{
            background-color: white;
            color: blue;
            width:100px;
            padding:5px;
            margin-top: 10px;
        }
        footer{
            background-color: black;
            color: white;
            text-align: center;
        }
        .box{
            display:grid;
            grid-template-columns:repeat(3,3fr);
            box-shadow: 2px 4px 2px gray;
            width:90%;
            text-align: center;
            padding: 80px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">TravelX</div>
        <span>home</span>
        <span>Destinations</span>
        <span>Packages</span>
    </nav>
    <section class="blue">
        <h2>Explore The World 🌍</h2>
        <p>Discover amazing and create unfirgettable memories</p>
        <button>Book Now</button>
    </section>
    <section class="box">
        <div><img src="./images/student.jpg"></div>
        <div><img src="./images/student.jpg"></div>
        <div><img src="./images/student.jpg"></div>
        <div><img src="./images/student.jpg"></div>
        <div><img src="./images/student.jpg"></div>
        <div><img src="./images/student.jpg"></div>
       
    </section>
    <footer>
        <span>2026 TraveDK</span>
    </footer>
</body>
</html>
