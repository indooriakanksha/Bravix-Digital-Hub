<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            box-sizing: border-box;

        }
        .Container{
            display: flex;

            justify-content: center;
            overflow: hidden;
            gap:30px;
            margin: auto;
            margin-top: 10%;
        }

        .card{
            text-align: center;
            width:300px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px gray;

            
        }
        img{
            width:200px;
            object-fit: cover;
        }
        span{
            color: red;
        }
        button{
            background-color: blue;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 10px 8px grey;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="Container">
     <div class="card">
       <img src="./images/images.jpg">
       <h1>Wireless Headphones</h1>
       <span>₹2,299</span>
       <p>High-quality wireless headphones with noise cancellation</p>
       <button>Buy Now</button>
     </div>
     <div class="card">
      <img src="./images/images.jpg" >
      <h1>Smart Watch</h1>
      <span>₹4,499</span>
      <p>Track your fitness and receive notifications on your wrist</p>
      <button>Buy Now</button>
     </div>
     <div class="card">
      <img src="./images/images.jpg" >
      <h1>Bluetooth Speaker</h1>
      <span>₹1,999</span>
      <p>Track your fitness and receive notifications on your wrist</p>
      <button>Buy Now</button>
     </div>
    </div>
</body>
</html>
