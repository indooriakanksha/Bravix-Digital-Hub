<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=prompt(`Enter anumber`);
        if(num%2===0){
            document.write(`${num} is an Even number`);
        }else{
            document.write(`${num} is an ODD number`);
        }
    </script>
</body>
</html>
