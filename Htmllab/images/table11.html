<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Tasks</title>
  <style>
    table{
        width:90%;


    }
  </style>
</head>
<body>
    <h1 >Invoice</h1>
    <table border="1" frame="box" cellspacing="0" cellpadding="10" align="center">
     <thead>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>2</td>
            <td>50000</td>
            <td>100000</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>3</td>
            <td>500</td>
            <td>1500</td>
        </tr>
        <tr>
            <td>Keyboard</td>
            <td>2</td>
            <td>1000</td>
            <td>2000</td>
        </tr>
        <tr>
            <td colspan="3">Grand Total</td>
            <td>103500</td>
        </tr>
     </thead>
    </table>
</body>
</html>
